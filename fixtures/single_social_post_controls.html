<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Single Social Post With Controls</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #172026; }
      main { max-width: 680px; margin: 32px auto; }
      article { background: #fff; border: 1px solid #d8dee5; border-radius: 8px; padding: 18px; }
      .actions { display: flex; gap: 12px; margin-top: 18px; }
      .action { border: 1px solid #ccd3dc; border-radius: 999px; background: #fff; padding: 8px 12px; }
      .media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
      .media-grid a { border: 1px solid #ccd3dc; border-radius: 8px; padding: 12px; color: #334155; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <article>
        <a href="/fixtures/posts/only">Only visible post</a>
        <p>This page has one real feed item, plus repeated controls inside the item.</p>
        <div class="actions">
          <div class="action" role="button">Reply to post</div>
          <div class="action" role="button">Repost this</div>
          <div class="action" role="button">Like this post</div>
        </div>
        <div class="media-grid">
          <a href="/fixtures/media/one">Image attachment one</a>
          <a href="/fixtures/media/two">Image attachment two</a>
          <a href="/fixtures/media/three">Image attachment three</a>
        </div>
      </article>
    </main>
  </body>
</html>
