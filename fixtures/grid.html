<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenPulse Fixture Grid</title>
    <style>
      body { font-family: system-ui, sans-serif; }
      main { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 32px; }
      article { border: 1px solid #ddd; padding: 16px; border-radius: 8px; }
      .price { font-size: 24px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <article><h2>Alpha Pack</h2><p class="price">$49.00</p><p>Available</p></article>
      <article><h2>Beta Pack</h2><p class="price">$79.00</p><p>Sold out</p></article>
      <article><h2>Gamma Pack</h2><p class="price">$99.00</p><p>In stock</p></article>
    </main>
  </body>
</html>
